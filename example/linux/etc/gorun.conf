# gorun site configuration (see go-env-review.md in the gorun repo).
#
# gorun honours this file only when it is owned by root and not group/world
# writable; a file that is present but invalid is a hard error. Machines
# without this file (e.g. Mac dev machines) run on built-in defaults.
#
# Precedence: command-line flags (argv) > embedded go.env section > this file
# > built-in defaults. GORUN_ARGS is ignored while this file exists.

# Absolute path to the go toolchain. Also what makes goscripts work from
# systemd/cron units, whose minimal PATH does not include go.
go_bin=/usr/local/go/bin/go

# Per-user build and module caches live in <cache_base>/<uid>/{gocache,gomod}.
# Create the base directory root-owned, mode 1777 (sticky), e.g. tmpfiles.d:
#   d /var/cache/gorun 1777 root root
cache_base=/var/cache/gorun

# Compiled script binaries live under <target_dir_base>/gorun-<host>-<uid>/
# (built-in default /var/tmp). Keeping them here too takes them out of the
# world-writable /var/tmp and away from systemd-tmpfiles ageing.
target_dir_base=/var/cache/gorun

# Delete a user's compiled binaries unused for this many days (built-in 7).
#clean_days=7

# Uppercase keys become build-environment defaults. GOTOOLCHAIN=local and
# GOENV=off are already gorun's built-in defaults (shown for visibility);
# a script's embedded go.env section can still override any of these.
#GOTOOLCHAIN=local
#GOENV=off
#GOAUTH=netrc
